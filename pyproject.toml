[project]
name = "mork-2"
version = "0.0.1"
description = "Mork-2, a small English and Python language model"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.6",
    "tokenizers>=0.22",
    "torch>=2.13.0",
]

[project.scripts]
mork-train = "mork.train:main"
mork-generate = "mork.generate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mork"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
